<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" fill="none">
  <!-- Classic Origami Folded Boat -->
  <!-- Sail Left -->
  <polygon points="50,10 50,52 28,52" fill="#FAF6EE" />
  <!-- Sail Right -->
  <polygon points="50,18 50,52 74,52" fill="#EDE6D8" />
  <!-- Boat Body Center -->
  <polygon points="50,52 28,52 14,54 22,70 50,70" fill="#E2DAC9" />
  <polygon points="50,52 74,52 86,54 78,70 50,70" fill="#D3C9B5" />
  <!-- Boat Inner Fold Shadow -->
  <polygon points="50,52 35,62 50,68 65,62" fill="#C5BBA7" />
  <!-- Crease Highlights -->
  <line x1="50" y1="10" x2="50" y2="70" stroke="#FAF7F2" stroke-width="0.8" opacity="0.8" />
</svg>
